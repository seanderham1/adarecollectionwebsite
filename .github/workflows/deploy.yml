name: Deploy to Firebase

# Prod: Hosting + Cloud Function `api` (contact / access-request). PRs do not deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_SITE_VERIFICATION: ${{ secrets.VITE_GOOGLE_SITE_VERIFICATION }}

      - name: Deploy Hosting
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project theadarecollection-site --non-interactive --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Deploy Cloud Function (api)
        run: |
          firebase deploy --only functions:api --project theadarecollection-site --non-interactive --token "${{ secrets.FIREBASE_TOKEN }}"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
